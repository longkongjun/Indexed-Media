[package]
name = "mediaflow-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "mediaflow_core"
path = "src/lib.rs"

[[bin]]
name = "mediaflow-core"
path = "src/main.rs"

[dependencies]
argon2 = { version = "=0.5.3", features = ["std"] }
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["json"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
clap = { version = "=4.6.2", features = ["derive"] }
futures-util = { version = "=0.3.32", default-features = false, features = ["async-await", "std"] }
hex = "=0.4.3"
getrandom = "=0.4.3"
ipnet = "=2.12.0"
notify = "=8.2.0"
quick-xml = "=0.41.0"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
rusqlite = { version = "=0.32.1", features = ["backup"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "=2.0.18"
subtle = "=2.6.1"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
unicode-normalization = "=0.1.25"

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
