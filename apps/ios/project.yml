name: MediaFlow
options:
  bundleIdPrefix: mediaflow.client
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Each Apple SDK consumes the matching Kotlin/Native binary; Intel simulators are not declared.
    MEDIAFLOW_KMP_TARGET: unsupported
    "MEDIAFLOW_KMP_TARGET[sdk=iphoneos*]": iosArm64
    "MEDIAFLOW_KMP_TARGET[sdk=iphonesimulator*]": iosSimulatorArm64
    MEDIAFLOW_KMP_FRAMEWORK_DIR: "$(SRCROOT)/../../packages/kmp-sdk/build/bin/$(MEDIAFLOW_KMP_TARGET)/$(MEDIAFLOW_KMP_VARIANT)Framework"
    "ARCHS[sdk=iphonesimulator*]": arm64
    DEVELOPMENT_TEAM: ""
    # 模拟器 ad-hoc 签名：Keychain（SecItemAdd）要求宿主进程带签名派生的
    # access groups，无签名（ALLOWED=NO）会以 -34018 拒绝写入。真机随第二批交付。
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"

  configs:
    Debug:
      MEDIAFLOW_KMP_VARIANT: debug
    Release:
      MEDIAFLOW_KMP_VARIANT: release

packages:
  IndexedDesign:
    path: ../../vendor/indexed-design/apple
  MediaFlowUI:
    path: ../../packages/ui-swift

targets:
  MediaFlowiOS:
    type: application
    platform: iOS
    sources:
      - MediaFlowiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mediaflow.client.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: MediaFlowiOS/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # fixture server 走本机 HTTP（生产部署经用户 HTTPS/VPN）
    preBuildScripts:
      - name: LinkKotlinFramework
        script: |
          cd "$SRCROOT/../.."
          set -eu
          case "$SDK_NAME" in
            iphoneos*) kmp_target=IosArm64 ;;
            iphonesimulator*) kmp_target=IosSimulatorArm64 ;;
            *) echo "Unsupported Apple SDK: $SDK_NAME" >&2; exit 2 ;;
          esac
          case "$CONFIGURATION" in
            Debug) kmp_variant=Debug ;;
            Release) kmp_variant=Release ;;
            *) echo "Unsupported build configuration: $CONFIGURATION" >&2; exit 2 ;;
          esac
          ./gradlew ":packages:kmp-sdk:link${kmp_variant}Framework${kmp_target}" --console=plain
    dependencies:
      - package: IndexedDesign
      - package: MediaFlowUI
      - framework: $(MEDIAFLOW_KMP_FRAMEWORK_DIR)/MediaFlowKit.framework
        embed: true
        codeSign: false

  MediaFlowiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MediaFlowiOSTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MediaFlowiOS
      - framework: $(MEDIAFLOW_KMP_FRAMEWORK_DIR)/MediaFlowKit.framework
        codeSign: false

  MediaFlowiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MediaFlowiOSUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MediaFlowiOS

schemes:
  MediaFlowiOS:
    build:
      targets:
        MediaFlowiOS: all
    test:
      targets:
        - MediaFlowiOSTests
  MediaFlowiOSUI:
    build:
      targets:
        MediaFlowiOS: all
    test:
      targets:
        - MediaFlowiOSUITests
      environmentVariables:
        - variable: M5B2_CORE_URL
          value: http://127.0.0.1:8650
          isEnabled: true
        # M5B2_ADMIN_NAME/M5B2_ADMIN_PASSWORD/M5B2_PAIRING_CODE 属敏感值，
        # 跑联调时临时注入 scheme（流程见 workflow-state 联调记录），不入库。
