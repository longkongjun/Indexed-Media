name: MediaFlow
options:
  bundleIdPrefix: mediaflow.client
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    # 模拟器 ad-hoc 签名：Keychain（SecItemAdd）要求宿主进程带签名派生的
    # access groups，无签名（ALLOWED=NO）会以 -34018 拒绝写入。真机随第二批交付。
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"

targets:
  MediaFlowiOS:
    type: application
    platform: iOS
    sources:
      - MediaFlowiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mediaflow.client.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: MediaFlowiOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # fixture server 走本机 HTTP（生产部署经用户 HTTPS/VPN）
    preBuildScripts:
      - name: LinkKotlinFramework
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :packages:kmp-sdk:linkDebugFrameworkIosSimulatorArm64 --console=plain
    dependencies:
      - framework: ../../packages/kmp-sdk/build/bin/iosSimulatorArm64/debugFramework/MediaFlowKit.framework
        embed: true
        codeSign: false

  MediaFlowiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MediaFlowiOSTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MediaFlowiOS
      - framework: ../../packages/kmp-sdk/build/bin/iosSimulatorArm64/debugFramework/MediaFlowKit.framework
        codeSign: false

  MediaFlowiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MediaFlowiOSUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MediaFlowiOS

schemes:
  MediaFlowiOS:
    build:
      targets:
        MediaFlowiOS: all
    test:
      targets:
        - MediaFlowiOSTests
  MediaFlowiOSUI:
    build:
      targets:
        MediaFlowiOS: all
    test:
      targets:
        - MediaFlowiOSUITests
      environmentVariables:
        - variable: M5B2_CORE_URL
          value: http://127.0.0.1:8650
          isEnabled: true
        # M5B2_ADMIN_NAME/M5B2_ADMIN_PASSWORD/M5B2_PAIRING_CODE 属敏感值，
        # 跑联调时临时注入 scheme（流程见 workflow-state 联调记录），不入库。
