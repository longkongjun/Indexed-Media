# detekt 配置：buildUponDefaultConfig=true，本文件只记录偏离项与理由。
# 随违规出现小步调整，不做投机性配置。

complexity:
  LongMethod:
    # 测试内的 given/when/then 场景组装允许较长；生产代码保持默认 60。
    threshold: 60
    excludes: ['**/src/*Test/**']
  LongParameterList:
    # DTO 组装与 Repository 构造参数经数据类/接口收拢前允许过渡；C1 收紧观察。
    active: false

naming:
  FunctionNaming:
    # Compose/DSL 惯例之外，KMP 测试工具函数存在动名词开头场景；保持默认但放宽前缀限制。
    ignoreAnnotated: ['Test']

style:
  MagicNumber:
    # HTTP 状态码/超时等协议常量集中于错误模型与网络层常量对象，放开测试与配置代码。
    ignoreAnnotated: ['Test']
  MaxLineLength:
    # 生成的契约客户端经 .editorconfig 豁免；手写代码 140（与 .editorconfig max_line_length 一致）。
    maxLineLength: 140

exceptions:
  # SDK 边界统一约定：传输/解码异常在指定边界点捕获并映射为 MediaFlowError，
  # 不外抛原始异常。这些边界的 catch(Exception) 是设计使然（各处 KDoc 已注明），
  # 逐点 @Suppress 只会产生噪音；规则关闭后由复审清单保证每个 catch 必须经
  # ErrorMapping/统一错误模型收口。
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
