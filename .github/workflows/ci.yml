# MediaFlow 持续集成：与本地 `just check-all` 同构的全量自动门禁。
# 说明：本仓库默认分支的远端 CI 在仓库被 push 后自动生效；本地聚合入口以根 justfile 为准。

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt / clippy / tests / docs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
      - name: Format
        run: cargo fmt --manifest-path apps/core/Cargo.toml -- --check
      - name: Clippy (pedantic, deny warnings)
        run: cargo clippy --manifest-path apps/core/Cargo.toml --all-targets -- -D warnings
      - name: Tests (all targets)
        run: cargo test --manifest-path apps/core/Cargo.toml --all-targets
      - name: Doctests
        run: cargo test --manifest-path apps/core/Cargo.toml --doc
      - name: Rustdoc (deny warnings)
        run: cargo doc --manifest-path apps/core/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  rust-deps:
    name: rust dependencies (advisories / licenses / unused)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/core/Cargo.toml
          arguments: --config apps/core/deny.toml
      - name: cargo-machete (unused dependencies)
        uses: bnjbvr/cargo-machete@main

  contracts:
    name: contracts (openapi / events / fixtures / clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: OpenAPI lint
        run: pnpm exec redocly lint contracts/openapi/mediaflow.v1.yaml
      - name: Events schema and examples
        run: CI=true pnpm --filter @mediaflow/test-fixtures typecheck && CI=true pnpm --filter @mediaflow/test-fixtures test -- --run
      - name: TypeScript API client
        run: CI=true pnpm --filter @mediaflow/api-client-ts typecheck && CI=true pnpm --filter @mediaflow/api-client-ts test -- --run && CI=true pnpm --filter @mediaflow/api-client-ts check-generated

  web:
    name: web (lint / types / unit / build / e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @mediaflow/web exec playwright install --with-deps chromium
      - name: ESLint
        run: CI=true pnpm --filter @mediaflow/web exec eslint .
      - name: Typecheck
        run: CI=true pnpm --filter @mediaflow/web typecheck
      - name: Unit tests
        run: CI=true pnpm --filter @mediaflow/web exec vitest --exclude "e2e/**" --run
      - name: Build and size budget
        run: |
          CI=true pnpm --filter @mediaflow/web exec vite build --outDir "$RUNNER_TEMP/dist" --emptyOutDir
          node apps/web/scripts/check-budget.mjs "$RUNNER_TEMP/dist"
      - name: Playwright E2E
        run: CI=true pnpm --filter @mediaflow/web exec playwright test --config playwright.config.ts
        env:
          MEDIAFLOW_TEST_OUTPUT_DIR: ${{ runner.temp }}/playwright

  infra:
    name: infra (containers / compose / nas docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container image checks (static + build)
        run: ./infra/containers/tests/check-image.sh
      - name: Compose config checks (static + docker compose config)
        run: ./infra/compose/tests/config.sh
      - name: NAS documentation gate
        run: ./infra/nas/tests/check-docs.sh
