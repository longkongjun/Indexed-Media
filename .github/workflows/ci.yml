# Public-source and infra checks. Native clients are covered by client-ci.yml.
# Third-party actions use full SHA; GITHUB_TOKEN remains read-only.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/core
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: rust
        run: just check-rust test-rust-doc check-rust-docs 2>&1 | tee "$RUNNER_TEMP/rust.log"
      - name: Preserve rust reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-reports
          path: |
            ${{ runner.temp }}/rust.log
          if-no-files-found: warn
  rust-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-machete@${{ env.CARGO_MACHETE_VERSION }}
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/core
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: rust-deps
        run: just check-rust-deps 2>&1 | tee "$RUNNER_TEMP/rust-deps.log"
      - name: Preserve rust-deps reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-deps-reports
          path: |
            ${{ runner.temp }}/rust-deps.log
          if-no-files-found: warn
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: contracts
        run: CI=true just check-contracts check-api-client-ts check-test-fixtures check-ui-contract check-gate-regressions 2>&1 | tee "$RUNNER_TEMP/contracts.log"
      - name: Preserve contracts reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-reports
          path: |
            ${{ runner.temp }}/contracts.log
          if-no-files-found: warn
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @mediaflow/web exec playwright install --with-deps chromium
      - name: web
        run: CI=true just check-web 2>&1 | tee "$RUNNER_TEMP/web.log"
      - name: Preserve web reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-reports
          path: |
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/mediaflow-web-check.*/
          if-no-files-found: warn
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: infra
        run: just check-containers check-compose check-nas 2>&1 | tee "$RUNNER_TEMP/infra.log"
      - name: Preserve infra reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infra-reports
          path: |
            ${{ runner.temp }}/infra.log
          if-no-files-found: warn
