# Public-source and infra checks. Native clients are covered by client-ci.yml.
# Verification stays read-only; only the trusted main candidate job may publish packages.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/core
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: rust
        run: just check-rust test-rust-doc check-rust-docs 2>&1 | tee "$RUNNER_TEMP/rust.log"
      - name: Preserve rust reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-reports
          path: |
            ${{ runner.temp }}/rust.log
          if-no-files-found: warn
  rust-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-machete@${{ env.CARGO_MACHETE_VERSION }}
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/core
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: rust-deps
        run: just check-rust-deps 2>&1 | tee "$RUNNER_TEMP/rust-deps.log"
      - name: Preserve rust-deps reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-deps-reports
          path: |
            ${{ runner.temp }}/rust-deps.log
          if-no-files-found: warn
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: contracts
        run: CI=true just check-contracts check-api-client-ts check-test-fixtures check-ui-contract check-gate-regressions check-release-tools 2>&1 | tee "$RUNNER_TEMP/contracts.log"
      - name: Preserve contracts reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-reports
          path: |
            ${{ runner.temp }}/contracts.log
          if-no-files-found: warn
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @mediaflow/web exec playwright install --with-deps chromium
      - name: web
        run: CI=true just check-web 2>&1 | tee "$RUNNER_TEMP/web.log"
      - name: Preserve web reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-reports
          path: |
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/mediaflow-web-check.*/
          if-no-files-found: warn
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: OCI build timestamp
        id: identity
        run: echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.1
      - name: Build the single candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/containers/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: mediaflow:sha-${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.identity.outputs.created }}
          cache-from: type=gha,scope=mediaflow-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=mediaflow-amd64' || '' }}
      - name: Validate the built image without rebuilding
        env:
          MEDIAFLOW_TEST_IMAGE: mediaflow:sha-${{ github.sha }}
        run: |
          ./infra/containers/tests/check-image.sh --existing-image 2>&1 | tee "$RUNNER_TEMP/infra.log"
          just check-compose smoke-m2-compose check-nas 2>&1 | tee -a "$RUNNER_TEMP/infra.log"
      - name: Save validated main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: docker save "mediaflow:sha-$SOURCE_SHA" -o "$RUNNER_TEMP/candidate.tar"
      - name: Preserve the exact validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-image-${{ github.sha }}
          path: ${{ runner.temp }}/candidate.tar
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Preserve infra reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infra-reports
          path: |
            ${{ runner.temp }}/infra.log
          if-no-files-found: warn
  candidate:
    needs: [rust, rust-deps, contracts, web, infra]
    if: >-
      github.repository == 'longkongjun/Indexed-Media' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: mediaflow-candidate-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Isolate temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/mediaflow-docker-auth" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-image-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Load the validated image
        run: docker load -i "$RUNNER_TEMP/candidate/candidate.tar"
      - name: Authenticate only this publishing job
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username longkongjun --password-stdin
      - name: Publish candidate and ordered edge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/release/publish.py candidate --output "$RUNNER_TEMP/candidate.json"
      - name: Preserve trusted candidate proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry login
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mediaflow-docker-auth
        run: docker logout ghcr.io
