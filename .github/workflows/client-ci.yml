# Native/JVM client gates share justfile with local checks.
name: client-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  kmp-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: JDK 17 launcher (daemon toolchain is declared by the project)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: kmp-sdk
        run: just client-check-build-scripts client-check-kmp-sdk client-docs-kmp-sdk 2>&1 | tee "$RUNNER_TEMP/kmp-sdk.log"
      - name: Preserve kmp-sdk reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kmp-sdk-reports
          path: |
            ${{ runner.temp }}/kmp-sdk.log
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: JDK 17 launcher (daemon toolchain is declared by the project)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: android
        run: just client-check-android client-check-android-tv 2>&1 | tee "$RUNNER_TEMP/android.log"
      - name: Preserve android reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            ${{ runner.temp }}/android.log
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
  fixture-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: JDK 17 launcher (daemon toolchain is declared by the project)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: fixture-server
        run: just client-check-fixture-server 2>&1 | tee "$RUNNER_TEMP/fixture-server.log"
      - name: Preserve fixture-server reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-server-reports
          path: |
            ${{ runner.temp }}/fixture-server.log
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load check tool versions
        run: |
          cat tools/selfcheck/tool-versions.env >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned check tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: JDK 17 launcher (daemon toolchain is declared by the project)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Native tool identity and SwiftLint
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available
          bash tools/selfcheck/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: ios
        run: just client-check-ios 2>&1 | tee "$RUNNER_TEMP/ios.log"
      - name: Preserve ios reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-reports
          path: |
            ${{ runner.temp }}/ios.log
            **/build/reports/
            **/build/test-results/
            ${{ runner.temp }}/mediaflow-ios-check.*/
          if-no-files-found: warn
