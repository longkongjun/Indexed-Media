# M5 客户端 CI（独立于 ci.yml；按共享文件策略只新增文件不改既有 workflow）。
# iOS 目标编译需要 macOS runner；JVM/Android 门禁同 job 内聚合。
name: client-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kmp-sdk:
    name: KMP SDK (lint + test + coverage)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: SDK gates (ktlint + detekt + test + kover)
        run: ./gradlew :packages:kmp-sdk:check :packages:kmp-sdk:koverLog

      - name: API docs build (dokka)
        run: ./gradlew :packages:kmp-sdk:dokkaGeneratePublicationHtml

  android:
    name: Android app (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :apps:android:assembleDebug :apps:android:testDebugUnitTest

  fixture-server:
    name: Fixture server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :tools:client-fixture-server:build

  ios:
    name: iOS app (build + unit tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate and test
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate
          xcodebuild test -project MediaFlow.xcodeproj -scheme MediaFlowiOS \
            -destination 'platform=iOS Simulator,name=iPhone 17'
