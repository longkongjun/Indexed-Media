name: desktop-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Verify immutable Design vendor and tamper regression
        run: |
          python tools/desktop/check-vendor.py
          python -m unittest discover -s tools/desktop -p 'test_*.py'
      - name: Desktop behavior and packaged image
        run: ./gradlew :apps:desktop:ktlintCheck :apps:desktop:test :apps:desktop:createDistributable --console=plain
      - name: Preserve desktop reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/build/reports/
            apps/desktop/build/test-results/
          if-no-files-found: warn
