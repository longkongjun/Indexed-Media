openapi: 3.1.2
info:
  title: MediaFlow API
  version: v1
  description: Contract-first API for MediaFlow identity, inbox scanning, continuous discovery, deterministic identification, review administration, formal catalog reads, downloader management, and source automation.
servers:
  - url: /
paths:
  /api/v1/system/bootstrap-status:
    get:
      operationId: getBootstrapStatus
      summary: Read instance bootstrap status
      description: Reports whether the local instance still requires its one-time administrator bootstrap without mutating state.
      responses:
        '200': { $ref: '#/components/responses/BootstrapStatus' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/system/bootstrap:
    post:
      operationId: bootstrapSystem
      summary: Bootstrap the local instance
      description: Uses the one-time bootstrap secret to create the sole administrator account for an uninitialized instance.
      security: []
      parameters: &public-write-parameters [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/SecFetchSite' }]
      requestBody: { $ref: '#/components/requestBodies/BootstrapRequest' }
      responses:
        '201': { $ref: '#/components/responses/BootstrapResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Create an administrator session
      description: Validates administrator credentials and returns the account and CSRF projection while setting the secure session cookie.
      security: []
      parameters: *public-write-parameters
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/session:
    get:
      operationId: getSession
      summary: Read the current session
      description: Returns the authenticated administrator account and CSRF projection for the current secure session cookie.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteSession
      summary: Delete the current session
      description: Invalidates the authenticated server session and expires its secure session cookie.
      security: &write-security [{ cookieAuth: [], csrfHeader: [] }]
      parameters: &write-parameters [{ $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/SecFetchSite' }]
      responses:
        '204':
          description: Session deleted and cookie expired.
          headers: { Set-Cookie: { description: 'Expired __Host-mediaflow_session cookie: empty value, Max-Age=0, optional Expires, Secure, HttpOnly, SameSite=Strict, and Path=/.', schema: { type: string, pattern: '^__Host-mediaflow_session=;\s*Max-Age=0;(?:\s*Expires=[^;]+;)?\s*Secure;\s*HttpOnly;\s*SameSite=Strict;\s*Path=/$' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployment-roots:
    get:
      operationId: listDeploymentRoots
      summary: List deployment capability roots
      description: Returns operator-configured roots that bound which local paths may be selected by inbox directories.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DeploymentRootList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/inbox-directories/preflight:
    post:
      operationId: preflightInboxDirectory
      summary: Preflight an inbox directory
      description: Normalizes and checks a capability-root-relative path for readability and overlap without persisting an inbox directory.
      security: *write-security
      parameters: *write-parameters
      requestBody: { $ref: '#/components/requestBodies/InboxDirectoryPreflightRequest' }
      responses:
        '200': { $ref: '#/components/responses/InboxDirectoryPreflight' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/inbox-directories:
    get:
      operationId: listInboxDirectories
      summary: List inbox directories
      description: Returns a bounded cursor page of persisted inbox directories and their last observed health.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/InboxDirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createInboxDirectory
      summary: Create an inbox directory
      description: Persists a validated capability-root-relative path as a scan source after authoritative containment and overlap checks.
      security: *write-security
      parameters: *write-parameters
      requestBody: { $ref: '#/components/requestBodies/CreateInboxDirectoryRequest' }
      responses:
        '201': { $ref: '#/components/responses/InboxDirectory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/inbox-directories/{inboxDirectoryId}:
    parameters: [{ $ref: '#/components/parameters/InboxDirectoryId' }]
    get:
      operationId: getInboxDirectory
      summary: Read an inbox directory
      description: Returns one persisted inbox directory and its last observed availability projection.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/InboxDirectory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/inbox-directories/{inboxDirectoryId}/scan-tasks:
    parameters: [{ $ref: '#/components/parameters/InboxDirectoryId' }]
    post:
      operationId: createScanTask
      summary: Create a scan task
      description: Idempotently accepts a durable background scan for an available inbox directory and returns its initial task projection.
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/ScanTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scan-tasks:
    get:
      operationId: listScanTasks
      summary: List scan tasks
      description: Returns a bounded cursor page of durable scan-task status, recovery, and aggregate-count projections.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/ScanTaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scan-tasks/{scanTaskId}:
    parameters: [{ $ref: '#/components/parameters/ScanTaskId' }]
    get:
      operationId: getScanTask
      summary: Read a scan task
      description: Returns the latest durable projection for one scan task, including recovery state and committed aggregate counts.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ScanTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scan-tasks/{scanTaskId}/attempts:
    parameters: [{ $ref: '#/components/parameters/ScanTaskId' }]
    post:
      operationId: retryScanTask
      summary: Retry a scan task
      description: Idempotently accepts a new attempt for a failed or partially successful task while retaining already committed facts.
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/ScanTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scan-tasks/{scanTaskId}/cancel:
    parameters: [{ $ref: '#/components/parameters/ScanTaskId' }]
    post:
      operationId: cancelScanTask
      summary: Cancel a scan task
      description: Idempotently requests cancellation of a queued or running task without deleting facts committed before cancellation.
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/ScanTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scan-tasks/{scanTaskId}/files:
    parameters: [{ $ref: '#/components/parameters/ScanTaskId' }]
    get:
      operationId: listScanTaskFiles
      summary: List discovered files
      description: Returns a bounded cursor page of file facts committed by the selected scan task.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/DiscoveredFilePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scan-tasks/{scanTaskId}/errors:
    parameters: [{ $ref: '#/components/parameters/ScanTaskId' }]
    get:
      operationId: listScanTaskErrors
      summary: List scan errors
      description: Returns a bounded cursor page of durable per-path error aggregates for the selected scan task.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/ScanErrorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/integrations/tmdb:
    get:
      operationId: getTmdbIntegration
      summary: Read TMDB integration configuration and health
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/TmdbIntegration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: putTmdbIntegration
      summary: Replace TMDB integration configuration
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { $ref: '#/components/requestBodies/PutTmdbIntegrationRequest' }
      responses:
        '200': { $ref: '#/components/responses/TmdbIntegration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteTmdbIntegration
      summary: Delete TMDB integration credentials
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: TMDB integration deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/integrations/tmdb/connection-tests:
    post:
      operationId: testTmdbConnection
      summary: Test TMDB credentials without saving them
      security: *write-security
      parameters: *write-parameters
      requestBody: { $ref: '#/components/requestBodies/TmdbConnectionTestRequest' }
      responses:
        '200': { $ref: '#/components/responses/TmdbConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/inbox-directories/{inboxDirectoryId}/discovery-policy:
    parameters: [{ $ref: '#/components/parameters/InboxDirectoryId' }]
    get:
      operationId: getDiscoveryPolicy
      summary: Read an inbox discovery policy
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DiscoveryPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: putDiscoveryPolicy
      summary: Replace an inbox discovery policy
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { $ref: '#/components/requestBodies/PutDiscoveryPolicyRequest' }
      responses:
        '200': { $ref: '#/components/responses/DiscoveryPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/processing-tasks:
    get:
      operationId: listProcessingTasks
      summary: List durable per-file processing tasks
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: view, in: query, schema: { enum: [pending, running, all, completed], default: pending } }
        - { name: stage, in: query, schema: { enum: [identification, planning, file-operation, nfo, completion] } }
        - { name: status, in: query, schema: { enum: [queued, running, waiting-confirmation, paused, partial-success, completed, failed, cancelled] } }
        - { name: inbox_directory_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/ProcessingTaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/processing-tasks/{processingTaskId}:
    parameters: [{ $ref: '#/components/parameters/ProcessingTaskId' }]
    get:
      operationId: getProcessingTask
      summary: Read a durable per-file processing task
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProcessingTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/processing-tasks/{processingTaskId}/identification:
    parameters: [{ $ref: '#/components/parameters/ProcessingTaskId' }]
    get:
      operationId: getProcessingTaskIdentification
      summary: Read identification evidence, candidates, and decision
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/IdentificationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/processing-tasks/{processingTaskId}/attempts:
    parameters: [{ $ref: '#/components/parameters/ProcessingTaskId' }]
    post:
      operationId: retryProcessingTask
      summary: Retry a recoverable processing task
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/ProcessingTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/processing-tasks/{processingTaskId}/cancel:
    parameters: [{ $ref: '#/components/parameters/ProcessingTaskId' }]
    post:
      operationId: cancelProcessingTask
      summary: Cancel a queued, running, or paused processing task
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/ProcessingTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/review-cases:
    get:
      operationId: listReviewCases
      summary: List active identification review cases
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: decision_level, in: query, schema: { enum: [probable, ambiguous, unidentified] } }
        - { name: inbox_directory_id, in: query, schema: { type: string, format: uuid } }
        - { name: updated_before, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/ReviewCasePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/review-cases/{reviewCaseId}:
    parameters: [{ $ref: '#/components/parameters/ReviewCaseId' }]
    get:
      operationId: getReviewCase
      summary: Read one active identification review case
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ReviewCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/review-cases/{reviewCaseId}/candidates:
    parameters: [{ $ref: '#/components/parameters/ReviewCaseId' }]
    get:
      operationId: searchReviewCandidates
      summary: Search bounded provider candidates for an active review case
      description: Returns ephemeral safe candidate summaries; reading this endpoint never changes identification history or the active case.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: media_type, in: query, required: true, schema: { enum: [movie, tv] } }
        - { name: locale, in: query, required: true, schema: { type: string, pattern: '^[a-z]{2}-[A-Z]{2}$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/ReviewCandidatePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/review-cases/{reviewCaseId}/decisions:
    parameters: [{ $ref: '#/components/parameters/ReviewCaseId' }]
    post:
      operationId: submitReviewDecision
      summary: Submit one immutable manual identification decision
