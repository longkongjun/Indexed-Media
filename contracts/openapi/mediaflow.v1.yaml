        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/automation-events/{automationEventId}/retries:
    parameters: [{ $ref: '#/components/parameters/AutomationEventId' }]
    post:
      operationId: retryAutomationEvent
      summary: Idempotently retry a recoverable automation event
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/AutomationEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/automation-events/{automationEventId}/cancellations:
    parameters: [{ $ref: '#/components/parameters/AutomationEventId' }]
    post:
      operationId: cancelAutomationEvent
      summary: Idempotently cancel an event before a downstream action is accepted
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/AutomationEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/identification-enhancer:
    get:
      operationId: getIdentificationEnhancer
      summary: Read the redacted local identification enhancer configuration
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/IdentificationEnhancer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: putIdentificationEnhancer
      summary: Replace the local identification enhancer configuration
      security: *write-security
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { $ref: '#/components/requestBodies/IdentificationEnhancerInput' }
      responses:
        '200': { $ref: '#/components/responses/IdentificationEnhancer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/identification-enhancer/connection-tests:
    post:
      operationId: testIdentificationEnhancer
      summary: Test a candidate local Ollama endpoint without saving it
      security: *write-security
      parameters: *write-parameters
      requestBody: { $ref: '#/components/requestBodies/IdentificationEnhancerInput' }
      responses:
        '200': { $ref: '#/components/responses/IdentificationEnhancerConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/source-webhooks/{automationSourceId}/events:
    parameters:
      - { $ref: '#/components/parameters/AutomationSourceId' }
      - { name: X-MediaFlow-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{10,16}$' } }
      - { name: X-MediaFlow-Nonce, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[\x21-\x7e]+$' } }
      - { name: X-MediaFlow-Signature, in: header, required: true, schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' } }
    post:
      operationId: acceptSourceWebhookEvent
      summary: Accept one signed fixed-shape automation event
      security: []
      requestBody: { $ref: '#/components/requestBodies/SourceWebhookEventRequest' }
      responses:
        '202': { $ref: '#/components/responses/AutomationEventAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Signed body exceeds the fixed byte limit. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Stream durable task and health events
      description: Streams version-one scan, processing, organization, identification, review, catalog, discovery-health, and integration-health events, resuming after Last-Event-ID or reporting a gap when replay is unavailable.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: Last-Event-ID, in: header, description: Positive event ID no greater than JavaScript MAX_SAFE_INTEGER, schema: { type: integer, minimum: 1, maximum: 9007199254740991 } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/SecFetchSite' }
      responses:
        '200': { description: Task events, content: { text/event-stream: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-mediaflow_session }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 512 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    InboxDirectoryId: { name: inboxDirectoryId, in: path, required: true, schema: { type: string, format: uuid } }
    ScanTaskId: { name: scanTaskId, in: path, required: true, schema: { type: string, format: uuid } }
    ProcessingTaskId: { name: processingTaskId, in: path, required: true, schema: { type: string, format: uuid } }
    ReviewCaseId: { name: reviewCaseId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaItemId: { name: mediaItemId, in: path, required: true, schema: { type: string, format: uuid } }
    DownloaderConnectionId: { name: downloaderConnectionId, in: path, required: true, schema: { type: string, format: uuid } }
    DownloadTaskId: { name: downloadTaskId, in: path, required: true, schema: { type: string, format: uuid } }
    AutomationSourceId: { name: automationSourceId, in: path, required: true, schema: { type: string, format: uuid } }
    AutomationEventId: { name: automationEventId, in: path, required: true, schema: { type: string, format: uuid } }
    OrganizationTargetId: { name: organizationTargetId, in: path, required: true, schema: { type: string, format: uuid } }
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 1 } }
    Origin: { name: Origin, in: header, required: false, description: Exact public origin proof used when Fetch Metadata is absent and checked whenever supplied., schema: { type: string, format: uri } }
    SecFetchSite: { name: Sec-Fetch-Site, in: header, required: false, description: Browser Fetch Metadata primary same-origin proof; cross-site and malformed values fail closed., schema: { type: string, enum: [same-origin, same-site, cross-site, none] } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    IfMatch: { name: If-Match, in: header, required: true, description: Decimal configuration version expected by the caller., schema: { type: string, pattern: '^[0-9]{1,19}$' } }
    ReviewDecisionIdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: Bounded key for replaying one exact manual decision request., schema: { type: string, minLength: 8, maxLength: 128 } }
    ReviewCaseIfMatch: { name: If-Match, in: header, required: true, description: Positive decimal active ReviewCase version expected by the caller., schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
  requestBodies:
    BootstrapRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    InboxDirectoryPreflightRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InboxDirectoryPreflightRequest' } } } }
    CreateInboxDirectoryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInboxDirectoryRequest' } } } }
    PutTmdbIntegrationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutTmdbIntegrationRequest' } } } }
    TmdbConnectionTestRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TmdbConnectionTestRequest' } } } }
    PutDiscoveryPolicyRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutDiscoveryPolicyRequest' } } } }
    ReviewDecisionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDecisionRequest' } } } }
    DownloaderConnectionInput: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DownloaderConnectionInput' } } } }
    CreateDownloadTaskRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDownloadTaskRequest' } } } }
    AutomationSourceInput: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationSourceInput' } } } }
    SourceWebhookEventRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceWebhookEventRequest' } } } }
    IdentificationEnhancerInput: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentificationEnhancerInput' } } } }
    OrganizationTargetInput: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTargetInput' } } } }
    OrganizationTargetPreflightRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTargetPreflightRequest' } } } }
    OrganizationCommandVersion: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCommandVersion' } } } }
  responses:
    BootstrapStatus: { description: Bootstrap state, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapStatusResponse' } } } }
    BootstrapResponse: { description: Administrator created, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapResponse' } } } }
    SessionResponse: { description: Session projection, headers: { Set-Cookie: { description: '__Host-mediaflow_session; Secure; HttpOnly; SameSite=Strict; Path=/', schema: { type: string, pattern: '^__Host-mediaflow_session=[^;]+;\s*Secure;\s*HttpOnly;\s*SameSite=Strict;\s*Path=/$' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
    DeploymentRootList: { description: Deployment roots, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentRootList' } } } }
    InboxDirectoryPreflight: { description: Inbox preflight, content: { application/json: { schema: { $ref: '#/components/schemas/InboxDirectoryPreflight' } } } }
    InboxDirectoryPage: { description: Inbox directories, content: { application/json: { schema: { $ref: '#/components/schemas/InboxDirectoryPage' } } } }
    InboxDirectory: { description: Inbox directory, content: { application/json: { schema: { $ref: '#/components/schemas/InboxDirectory' } } } }
    ScanTaskPage: { description: Scan tasks, content: { application/json: { schema: { $ref: '#/components/schemas/ScanTaskPage' } } } }
    ScanTask: { description: Scan task, content: { application/json: { schema: { $ref: '#/components/schemas/ScanTask' } } } }
    DiscoveredFilePage: { description: Discovered files, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveredFilePage' } } } }
    ScanErrorPage: { description: Scan errors, content: { application/json: { schema: { $ref: '#/components/schemas/ScanErrorPage' } } } }
    TmdbIntegration: { description: Redacted TMDB configuration and health, content: { application/json: { schema: { $ref: '#/components/schemas/TmdbIntegration' } } } }
    TmdbConnectionTestResult: { description: Non-persistent TMDB connection test result, content: { application/json: { schema: { $ref: '#/components/schemas/TmdbConnectionTestResult' } } } }
    DiscoveryPolicy: { description: Versioned inbox discovery policy, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryPolicy' } } } }
    ProcessingTaskPage: { description: Per-file processing tasks, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingTaskPage' } } } }
    ProcessingTask: { description: Per-file processing task, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingTask' } } } }
    IdentificationDetail: { description: Bounded identification detail, content: { application/json: { schema: { $ref: '#/components/schemas/IdentificationDetail' } } } }
    ReviewCasePage: { description: Active identification review cases, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCasePage' } } } }
    ReviewCase: { description: Active identification review case, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCase' } } } }
    ReviewCandidatePage: { description: Ephemeral bounded provider candidates, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCandidatePage' } } } }
    TaskDecisionReceipt: { description: Durable accepted manual decision receipt, content: { application/json: { schema: { $ref: '#/components/schemas/TaskDecisionReceipt' } } } }
    MediaItemPage: { description: Formal local media records, content: { application/json: { schema: { $ref: '#/components/schemas/MediaItemPage' } } } }
    MediaItemDetail: { description: Formal local media detail, content: { application/json: { schema: { $ref: '#/components/schemas/MediaItemDetail' } } } }
    DownloaderConnectionPage: { description: Redacted downloader connections, content: { application/json: { schema: { $ref: '#/components/schemas/DownloaderConnectionPage' } } } }
    DownloaderConnection: { description: One redacted downloader connection, content: { application/json: { schema: { $ref: '#/components/schemas/DownloaderConnection' } } } }
    DownloaderConnectionTestResult: { description: Non-persistent downloader connection test result, content: { application/json: { schema: { $ref: '#/components/schemas/DownloaderConnectionTestResult' } } } }
    DownloadTaskPage: { description: MediaFlow-owned download tasks, content: { application/json: { schema: { $ref: '#/components/schemas/DownloadTaskPage' } } } }
    DownloadTask: { description: One redacted MediaFlow-owned download task, content: { application/json: { schema: { $ref: '#/components/schemas/DownloadTask' } } } }
    AutomationSourcePage: { description: Redacted automation sources, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationSourcePage' } } } }
    AutomationSource: { description: One redacted automation source, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationSource' } } } }
    AutomationSourceCreateResult: { description: Redacted source or one-time webhook secret receipt, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationSourceCreateResult' } } } }
    AutomationSourceConnectionTestResult: { description: Non-persistent source health result, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationSourceConnectionTestResult' } } } }
    WebhookSecretReceipt: { description: One-time webhook secret receipt, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSecretReceipt' } } } }
    AutomationEventPage: { description: Redacted automation events, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationEventPage' } } } }
    AutomationEvent: { description: One redacted automation event, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationEvent' } } } }
    AutomationEventAccepted: { description: Accepted automation event identity, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationEventAccepted' } } } }
    IdentificationEnhancer: { description: Redacted local enhancer configuration, content: { application/json: { schema: { $ref: '#/components/schemas/IdentificationEnhancer' } } } }
    IdentificationEnhancerConnectionTestResult: { description: Non-persistent local enhancer test result, content: { application/json: { schema: { $ref: '#/components/schemas/IdentificationEnhancerConnectionTestResult' } } } }
    OrganizationTargetPage: { description: Versioned organization targets, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTargetPage' } } } }
    OrganizationTarget: { description: One safe organization target projection, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTarget' } } } }
    OrganizationTargetPreflight: { description: Non-persistent organization target preflight, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTargetPreflight' } } } }
    ProcessingTaskOrganization: { description: "One task's safe plan, journals, and local result", content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingTaskOrganization' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    Forbidden: { description: CSRF or Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    Conflict: { description: Request conflicts with current state, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    ValidationFailed: { description: Request validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    RateLimited: { description: Request rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    ServiceUnavailable: { description: Service is not ready, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
    InternalError: { description: Internal error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorBody' } } } }
  schemas:
    ApiErrorBody:
      description: Allow-listed API failure envelope with a correlation request ID and optional safe structured details.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, enum: [bootstrap.already_completed, bootstrap.invalid_secret, auth.invalid_credentials, auth.rate_limited, session.expired, csrf.invalid, origin.untrusted, root.not_found, root.unavailable, path.invalid, path.escape, path.symlink_forbidden, inbox.overlap, inbox.not_found, task.not_found, task.invalid_state, task.lease_lost, integration.not_configured, integration.unauthorized, integration.rate_limited, integration.unsupported-version, provider.unavailable, provider.timeout, provider.response-too-large, provider.invalid-response, download.correlation-ambiguous, download.remote-missing, automation.source-disabled, automation.signature-invalid, automation.replay, automation.action-invalid, automation.payload-invalid, automation.downstream-conflict, organization.root-read-only, organization.target-overlap, organization.target-unavailable, organization.path-outside-root, organization.target-exists, organization.source-changed, organization.hardlink-cross-device, organization.operation-unsupported, organization.journal-ambiguous, revision.changed, event.cursor_expired, request.conflict, validation.failed, internal.error] }
            message: { type: string }
            request_id: { type: string, format: uuid }
            details: { type: object, additionalProperties: { type: [string, number, boolean, 'null'] } }
    BootstrapStatusResponse:
      description: Public instance readiness projection indicating whether one-time bootstrap remains required.
      type: object
      additionalProperties: false
      required: [requires_initialization, version]
      properties: { requires_initialization: { type: boolean }, version: { const: v1 } }
    BootstrapRequest:
      description: One-time bootstrap secret and credentials used to create the sole administrator account.
      type: object
      additionalProperties: false
      required: [bootstrap_secret, administrator_name, password]
      properties: { bootstrap_secret: { type: string, minLength: 1, writeOnly: true }, administrator_name: { type: string, minLength: 1 }, password: { type: string, minLength: 12, writeOnly: true } }
    BootstrapResponse:
      description: Administrator account projection returned after the instance is successfully bootstrapped.
      type: object
      additionalProperties: false
      required: [account, version]
      properties: { account: { $ref: '#/components/schemas/AccountSummary' }, version: { const: v1 } }
    LoginRequest:
      description: Administrator credentials submitted to create a secure browser session.
      type: object
      additionalProperties: false
      required: [administrator_name, password]
      properties: { administrator_name: { type: string, minLength: 1 }, password: { type: string, minLength: 1, writeOnly: true } }
    AccountSummary:
      description: Public identity projection for the sole local administrator account.
      type: object
      additionalProperties: false
      required: [id, administrator_name]
      properties: { id: { type: string, format: uuid }, administrator_name: { type: string } }
    SessionResponse:
      description: Authenticated administrator projection and CSRF token associated with the secure session cookie.
      type: object
      additionalProperties: false
      required: [account, csrf_token, version]
      properties: { account: { $ref: '#/components/schemas/AccountSummary' }, csrf_token: { type: string, minLength: 43 }, version: { const: v1 } }
    DeploymentRootList:
      description: Bounded collection of operator-configured filesystem capability roots.
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DeploymentRoot' } }, next_cursor: { type: [string, 'null'] } }
    DeploymentRoot:
      description: Opaque capability-root identity, display label, and permitted access mode without a host absolute path.
      type: object
      additionalProperties: false
      required: [id, label, access]
      properties: { id: { type: string }, label: { type: string }, access: { enum: [read-only, read-write] } }
    InboxDirectoryPreflightRequest:
      description: Capability-root identity and root-relative path to check without persisting state.
      type: object
      additionalProperties: false
      required: [root_id, relative_path]
      properties: { root_id: { type: string }, relative_path: { type: string, minLength: 1 } }
    InboxDirectoryPreflight:
      description: Normalized root-relative path together with authoritative readability and overlap observations.
      type: object
      additionalProperties: false
      required: [root_id, relative_path, readable, overlaps_existing]
      properties: { root_id: { type: string }, relative_path: { type: string }, readable: { type: boolean }, overlaps_existing: { type: boolean } }
    CreateInboxDirectoryRequest:
      description: Capability-root identity and root-relative path submitted for authoritative validation and persistence.
      type: object
      additionalProperties: false
      required: [root_id, relative_path]
      properties: { root_id: { type: string }, relative_path: { type: string, minLength: 1 } }
    InboxDirectory:
      description: Persisted scan-source identity, normalized root-relative path, and last observed availability.
      type: object
      additionalProperties: false
      required: [id, root_id, relative_path, health, last_checked_at]
      properties: { id: { type: string, format: uuid }, root_id: { type: string }, relative_path: { type: string }, health: { enum: [available, unavailable] }, last_checked_at: { type: string, format: date-time } }
    InboxDirectoryPage:
      description: Bounded cursor page of persisted inbox-directory projections.
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/InboxDirectory' } }, next_cursor: { type: [string, 'null'] } }
    ScanCounts:
      description: Nonnegative aggregate counts; persisted scan-task projections reflect committed state, while TaskProgressEvent payloads are the latest observed aggregate and must not be treated as persisted facts.
      type: object
      additionalProperties: false
      required: [visited_directories, observed_files, skipped_entries, errors]
      properties: { visited_directories: { type: integer, minimum: 0, maximum: 9007199254740991 }, observed_files: { type: integer, minimum: 0, maximum: 9007199254740991 }, skipped_entries: { type: integer, minimum: 0, maximum: 9007199254740991 }, errors: { type: integer, minimum: 0, maximum: 9007199254740991 } }
    ScanTask:
      description: Durable scan-task identity, lifecycle status, recovery flag, and committed aggregate counts.
      type: object
      additionalProperties: false
      required: [id, inbox_directory_id, status, recovering, counts]
      properties: { id: { type: string, format: uuid }, inbox_directory_id: { type: string, format: uuid }, status: { enum: [queued, running, partial-success, completed, failed, cancelled] }, recovering: { type: boolean }, counts: { $ref: '#/components/schemas/ScanCounts' } }
    ScanTaskPage:
      description: Bounded cursor page of durable scan-task projections.
      type: object
